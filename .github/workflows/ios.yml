name: ios

on:
  workflow_dispatch:
    inputs:
      src_ref:
        description: 'source branch / tag to build'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: f15890670705-art/luatouch-wda-src
          ref: ${{ github.event.inputs.src_ref || 'main' }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Unpack embedded frameworks
        run: |
          mkdir -p Sources/AXTouch/Frameworks
          unzip -o frameworks.zip -d Sources/AXTouch/Frameworks
          ls Sources/AXTouch/Frameworks

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AXTouch.xcodeproj -scheme AXTouch \
            -sdk iphoneos -configuration Release -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS=arm64 build > /tmp/xb.log 2>&1 || {
              echo "===== build errors ====="
              grep -nE "error:" /tmp/xb.log | head -30
              echo "===== last 60 lines ====="
              tail -60 /tmp/xb.log
              exit 1
            }
          tail -20 /tmp/xb.log

      - name: Package ipa
        run: |
          set -e
          APP=dd/Build/Products/Release-iphoneos/AXTouch.app
          test -f "$APP/AXTouch"
          mkdir -p Payload
          cp -R "$APP" Payload/

          # broadcast extension must really land in PlugIns
          if [ ! -d Payload/AXTouch.app/PlugIns/AXBroadcast.appex ]; then
            mkdir -p Payload/AXTouch.app/PlugIns
            cp -R dd/Build/Products/Release-iphoneos/AXBroadcast.appex \
              Payload/AXTouch.app/PlugIns/ || true
          fi
          test -d Payload/AXTouch.app/PlugIns/AXBroadcast.appex || {
            echo "===== missing broadcast extension ====="
            find dd/Build/Products/Release-iphoneos -maxdepth 2 -name "*.appex" | head -30
            exit 1
          }

          echo "--- PlugIns ---"
          ls -l Payload/AXTouch.app/PlugIns
          echo "--- app content ---"
          ls Payload/AXTouch.app
          du -sh Payload/AXTouch.app

          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            Payload/AXTouch.app/Info.plist)
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            Payload/AXTouch.app/Info.plist)
          echo "version=$VER bundle=$BID"
          zip -qry "AXTouch-${VER}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: '*.ipa'
